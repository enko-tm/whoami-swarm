version: '3.8'

services:
  whoami:
    image: traefik/whoami:v1.10
    ports:
      # Expose port 8080 on the host, mapping to 80 inside the container
      - "8383:80"
    networks:
      - test-net
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

networks:
  test-net:
    driver: overlay
